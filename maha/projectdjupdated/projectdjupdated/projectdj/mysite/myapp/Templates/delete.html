{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h3>Are you sure you want to delete this post?</h3>
    <p><strong>{{ post.blog }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
