{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h3>Add Post</h3>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Add Post</button>
    </form>
</div>
{% endblock %}
